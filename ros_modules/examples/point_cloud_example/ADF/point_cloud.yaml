point clouds: [POINTCLOUD ONE]
namespace: /ambf/env/point_clouds/

POINTCLOUD ONE:
  name: point_cloud_adf
  parent: Chassis
  color components:
    ambient:
      level: 1.0
    diffuse:
      b: 0.0
      g: 0.2
      r: 0.9
    specular:
      b: 0.0
      g: 0.2
      r: 0.9
    shininess: 1
    transparency: 1.0
  shaders:
    path: shaders/
    vertex: shader.vs
    geometry: shader.gs
    fragment: shader.fs
    geometry data: {
      input type: points,
      output type: triangle_strip,
      max vertices out: 10
    }