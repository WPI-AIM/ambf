# Primitive visual-shape test. No collision geometry is specified so the
# framework's visual-to-collision fallback can be tested for every body.
bodies:
  - BODY box
  - BODY sphere
  - BODY cylinder_x
  - BODY cylinder_y
  - BODY cylinder_z
  - BODY capsule_x
  - BODY capsule_y
  - BODY capsule_z
  - BODY cone_x
  - BODY cone_y
  - BODY cone_z
  - BODY plane
joints: []
sensors: []
actuators: []
cameras: []
lights: []
soft bodies: []
namespace: /ambf/env/test_shapes/

BODY box:
  name: box
  mass: 1.0
  scale: 1.0
  location:
    position: {x: -0.6, y: 0.0, z: 0.3}
    orientation: {r: 0.0, p: 0.0, y: 0.0}
  shape: BOX
  geometry: {x: 0.16, y: 0.16, z: 0.16}

BODY sphere:
  name: sphere
  mass: 1.0
  scale: 1.0
